name: CI

on:
  push:
    branches: [main]
    tags: ['*.*.*']
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 已发布且需要复验的 Release tag；留空时只执行仓库校验
        required: false
        default: ''
        type: string

jobs:
  verify-repository:
    name: 校验分发清单与 Demo 边界
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: 校验版本、清单与 SwiftPM 资源
        run: |
          swift package dump-package > /dev/null
          pod ipc spec YKIFLYADLib.podspec > /tmp/youku-podspec.json
          python3 - <<'PY'
          import json
          import os
          import plistlib
          import re
          from pathlib import Path

          package = Path("Package.swift").read_text(encoding="utf-8")
          podspec = Path("YKIFLYADLib.podspec").read_text(encoding="utf-8")
          readme = Path("README.md").read_text(encoding="utf-8")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          releasing = Path("RELEASING.md").read_text(encoding="utf-8")
          demo_podfile = Path("IFLYADLibSimple/Podfile").read_text(encoding="utf-8")
          demo_readme = Path("IFLYADLibSimple/README.md").read_text(encoding="utf-8")
          podspec_json = json.loads(
              Path("/tmp/youku-podspec.json").read_text(encoding="utf-8")
          )
          pod_version = re.search(r"s\.version\s*=\s*['\"]([^'\"]+)", podspec).group(1)
          package_version = re.search(r"/releases/download/([^/]+)/IFLYADLib", package).group(1)
          pod_url_version = re.search(r"/releases/download/([^/]+)/YKIFLYADLib", podspec).group(1)
          demo_pod_version = re.search(
              r"YKIFLYADLib_iOS/([^/]+)/YKIFLYADLib\.podspec", demo_podfile
          ).group(1)
          assert pod_version == package_version == pod_url_version == demo_pod_version
          pending_changelog_heading = f"## {pod_version}（待发布）"
          final_changelog_heading = f"## {pod_version}"
          release_state_match = re.search(
              r"### 当前联调状态\s+(.*?)(?=\n2026 年 7 月 30 日)",
              releasing,
              re.S,
          )
          assert release_state_match, "RELEASING.md 缺少 6.2.2 当前状态段"
          release_state = release_state_match.group(1)
          for lifecycle_token in (
              "playRequested",
              "pausePlay",
              "stopPlay",
              "resumePlay",
              "startPlay",
          ):
              assert lifecycle_token in readme, lifecycle_token
              assert lifecycle_token in demo_readme, lifecycle_token
          assert "AdSupport" in podspec_json.get("frameworks", []), (
              "podspec 缺少 AdSupport 强链接声明"
          )
          assert "AppTrackingTransparency" in podspec_json.get("weak_frameworks", []), (
              "podspec 缺少 AppTrackingTransparency 弱链接声明"
          )
          assert "-ObjC" in podspec_json.get("pod_target_xcconfig", {}).get(
              "OTHER_LDFLAGS", ""
          ).split(), "pod target 未声明 -ObjC"
          assert "-ObjC" in podspec_json.get("user_target_xcconfig", {}).get(
              "OTHER_LDFLAGS", ""
          ).split(), "aggregate/user target 未声明 -ObjC"

          checksum = re.search(r'checksum:\s*"([^"]+)"', package).group(1)
          pending_checksum = "__IFLYADLIB_YOUKU_6_2_2_CHECKSUM_PENDING__"
          is_tag_push = os.environ.get("GITHUB_REF_TYPE") == "tag"
          if is_tag_push:
              assert os.environ.get("GITHUB_REF_NAME") == pod_version, (
                  os.environ.get("GITHUB_REF_NAME"), pod_version
              )
          if checksum == pending_checksum:
              assert not is_tag_push, "tag push 不得携带 PENDING checksum"
              assert pod_version == "6.2.2"
              assert f"当前清单目标版本：`{pod_version}`" in readme
              assert "发布准备" in readme
              assert "正式签名资产、checksum、tag 和 Release 尚未生成" in readme
              assert "待发布 tag `6.2.2`" in demo_readme
              assert "进入公开仓准备态" in release_state
              assert "尚未完成" in release_state
              assert re.search(
                  r"^" + re.escape(pending_changelog_heading) + r"\s*$",
                  changelog,
                  re.M,
              )
              checksum_state = "PENDING（不可发布）"
          else:
              assert re.fullmatch(r"[0-9a-f]{64}", checksum)
              assert checksum != "0" * 64
              assert checksum != "a3c31e6fc523aa2bb1af71849ba1dc893d94e69ae68246eab4d9d20cbb07232f", (
                  "6.2.2 不得沿用 6.2.1 checksum"
              )
              assert f"当前版本：`{pod_version}`" in readme
              for stale_marker in (
                  "发布准备",
                  "准备态",
                  "尚未生成",
                  "最近正式版 `6.2.1`",
                  "当前正式 `6.2.1`",
                  "尚不存在的 `6.2.2`",
                  "待发布 `6.2.2`",
                  "/6.2.1/YKIFLYADLib.podspec",
              ):
                  assert stale_marker not in readme, stale_marker
              for stale_marker in ("待发布", "准备态"):
                  assert stale_marker not in demo_readme, stale_marker
              assert "PENDING" not in package
              assert f"/{pod_version}/YKIFLYADLib.podspec" in readme
              assert "最新正式版本仍为 `6.2.1`" not in changelog
              assert "发布准备内容" not in changelog
              for stale_marker in (
                  "进入公开仓准备态",
                  "尚未完成",
                  "不得作为正式发布证据",
                  "替换准备态事实",
              ):
                  assert stale_marker not in release_state, stale_marker
              assert f"`{pod_version}` 正式分发资产" in release_state
              assert "delivery-manifest.json" in release_state
              assert re.search(
                  r"^" + re.escape(final_changelog_heading) + r"\s*$",
                  changelog,
                  re.M,
              )
              assert pending_changelog_heading not in changelog
              checksum_state = "已回填"
          assert '.library(name: "IFLYADLib", targets: ["IFLYADLib", "IFLYAdResources"])' in package
          assert '.copy("IFLYPlayer.bundle")' in package
          assert Path("spm/IFLYAdResources/IFLYAdResourceAnchor.m").is_file()
          assert Path("spm/IFLYAdResources/include/IFLYAdResourceAnchor.h").is_file()
          executable_resources = [
              path
              for path in Path("spm/IFLYAdResources/IFLYPlayer.bundle").rglob("*")
              if path.is_file() and path.stat().st_mode & 0o111
          ]
          assert not executable_resources, executable_resources
          privacy_path = Path("spm/IFLYAdResources/IFLYPlayer.bundle/PrivacyInfo.xcprivacy")
          assert privacy_path.is_file()
          tracking_domains = plistlib.loads(
              privacy_path.read_bytes()
          )["NSPrivacyTrackingDomains"]
          assert "youku-sdk.voiceads.cn" in tracking_domains
          assert "msdk.voiceads.cn" not in tracking_domains
          assert "youku-sdk-grey.voiceads.cn" not in tracking_domains
          print(f"version={pod_version}, checksum={checksum_state}: {checksum}")
          PY

      - name: 读取 A/B 发布状态
        id: provenance-state
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          states = re.findall(
              r"^- `releaseState`：`(PENDING|FORMAL)`$",
              Path("RELEASING.md").read_text(encoding="utf-8"),
              re.M,
          )
          assert len(states) == 1, states
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"state={states[0]}\n")
          PY

      - name: 校验 PENDING A/B provenance
        if: steps.provenance-state.outputs.state == 'PENDING' && github.ref_type != 'tag' && github.event_name != 'release' && !(github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        run: |
          python3 .github/scripts/verify_private_release_provenance.py \
            --readme README.md \
            --changelog CHANGELOG.md \
            --releasing RELEASING.md \
            --skip-compare

      - name: 正式 tag/Release 明确拒绝 PENDING A/B
        if: steps.provenance-state.outputs.state == 'PENDING' && (github.ref_type == 'tag' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
        run: |
          echo '正式 tag/Release 不得保留 PENDING releaseState 或 A/B 占位' >&2
          exit 1

      - name: 校验 FORMAL A/B provenance 文档
        if: steps.provenance-state.outputs.state == 'FORMAL' && github.ref_type != 'tag' && github.event_name != 'release' && !(github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        run: |
          python3 .github/scripts/verify_private_release_provenance.py \
            --readme README.md \
            --changelog CHANGELOG.md \
            --releasing RELEASING.md \
            --skip-compare

      - name: 正式 tag/Release 校验 FORMAL A/B provenance（私有仓 compare）
        if: steps.provenance-state.outputs.state == 'FORMAL' && (github.ref_type == 'tag' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
        env:
          IFLY_PRIVATE_SOURCE_TOKEN: ${{ secrets.IFLY_PRIVATE_SOURCE_TOKEN }}
        run: |
          python3 .github/scripts/verify_private_release_provenance.py \
            --readme README.md \
            --changelog CHANGELOG.md \
            --releasing RELEASING.md

      - name: Tag push 校验 annotated tag 与 checkout 绑定
        if: github.ref_type == 'tag'
        run: |
          test "${GITHUB_REF_NAME}" = '6.2.2'
          test -z "$(git status --porcelain)"
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = 'tag'
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          test "$(git describe --tags --exact-match HEAD)" = "${GITHUB_REF_NAME}"

      - name: 校验 Demo 只含三个自渲染示例
        run: |
          test ! -d IFLYADLibSimple/IFLYADLibSimple/biz/splash
          test ! -d IFLYADLibSimple/IFLYADLibSimple/biz/interstitial
          test -f IFLYADLibSimple/IFLYADLibSimple/biz/native/IFLYNativeViewController.m
          test -f IFLYADLibSimple/IFLYADLibSimple/biz/native/demo/IFLYNativeFeedDemoImageLoader.h
          test -f IFLYADLibSimple/IFLYADLibSimple/biz/native/demo/IFLYNativeFeedDemoImageLoader.m
          test -f IFLYADLibSimple/IFLYADLibSimple/biz/native/presentation/IFLYNativeFeedDemoPresentationView.h
          test -f IFLYADLibSimple/IFLYADLibSimple/biz/native/presentation/IFLYNativeFeedDemoPresentationView.m
          test -f IFLYADLibSimple/IFLYADLibSimple/biz/native/presentation/IFLYNativeFeedPresentationDemoViewController.h
          test -f IFLYADLibSimple/IFLYADLibSimple/biz/native/presentation/IFLYNativeFeedPresentationDemoViewController.m
          test ! -d IFLYADLibSimple/IFLYADLibSimple/biz/banner
          test ! -d IFLYADLibSimple/IFLYADLibSimple/biz/reward
          if grep -R -n -E --exclude-dir=build 'IFLYBanner|IFLYReward' IFLYADLibSimple; then
            echo "优酷 Demo 不得包含 Banner 或 Reward 接入" >&2
            exit 1
          fi
          if grep -n -E 'DEVELOPMENT_TEAM = [A-Z0-9]+' \
            IFLYADLibSimple/IFLYADLibSimple.xcodeproj/project.pbxproj; then
            echo "Demo 工程不得固化 DEVELOPMENT_TEAM" >&2
            exit 1
          fi
          grep -R -n -E 'IFLYDemoPrivacyConsentViewController|exit\(0\)' \
            IFLYADLibSimple/IFLYADLibSimple
          python3 - <<'PY'
          import re
          from pathlib import Path

          home = Path("IFLYADLibSimple/IFLYADLibSimple/ViewController.m").read_text(encoding="utf-8")
          for title in (
              "自渲染开屏",
              "自渲染插屏",
              "自渲染信息流示例",
          ):
              assert f'@"{title}"' in home, title
          for forbidden in (
              '@"开屏广告"',
              '@"插屏广告"',
              "IFLYSplashViewController",
              "IFLYInterstitialViewController",
              "splashADTypeClick:",
              "interstitialADTypeClick:",
          ):
              assert forbidden not in home, forbidden
          assert home.count('@{@"title"') == 3
          assert "IFLYNativeFeedDemoPresentationStyleSplash" in home
          assert "IFLYNativeFeedDemoPresentationStyleInterstitial" in home

          native = Path(
              "IFLYADLibSimple/IFLYADLibSimple/biz/native/IFLYNativeViewController.m"
          ).read_text(encoding="utf-8")
          assert 'self.title = @"自渲染信息流示例"' in native
          presentation = Path(
              "IFLYADLibSimple/IFLYADLibSimple/biz/native/presentation/"
              "IFLYNativeFeedPresentationDemoViewController.m"
          ).read_text(encoding="utf-8")
          presentation_view = Path(
              "IFLYADLibSimple/IFLYADLibSimple/biz/native/presentation/"
              "IFLYNativeFeedDemoPresentationView.m"
          ).read_text(encoding="utf-8")
          demo_sources = native + presentation + presentation_view
          for required in (
              "appName",
              "bidInfo.price",
              "bidInfo.dealId",
              "binder.clickViews = @[]",
              "nativeFeedAdDidPlayFinish:",
              "reportMediaShakeTriggeredWithError:",
              "nativeFeed.demo.reportMediaShake",
              "IFLYNativeFeedDemoItem",
              "attachWithViewBinder:",
              "detachAdFromContainerView:",
              "configureWithAd:",
              "detachFromContainer",
              "prepareForReuse",
              "attachedAdCell",
              "[ad destroy]",
              "didEndDisplayingCell:",
              "representedItemIdentifier",
              "videoCoverVisible",
              "recordVideoCoverVisible:",
          ):
              assert required in demo_sources, required
          for forbidden in (
              "actionText",
              "rawAdData",
              ".ecpm",
              "IFLYNativeFeedAdMaterialTypeThreeImages",
              "IFLYNativeFeedDisplaySession",
              "IFLYNativeFeedAdBinding",
              "beginDisplaySessionWithError:",
              "bindAdWithViewBinder:",
              "unbindAd",
              "endDisplaySession",
          ):
              assert forbidden not in demo_sources, forbidden
          cell_implementation = native.index("@implementation IFLYNativeFeedDemoCell")
          configure_start = native.index("- (BOOL)configureWithAd:", cell_implementation)
          configure_end = native.index("- (void)detachFromContainer", configure_start)
          configure = native[configure_start:configure_end]
          assert configure.index("[self detachFromContainer]") < configure.index(
              "IFLYNativeFeedAdData *data"
          ), "Cell 改配必须先反注册旧容器再修改 UI"
          attach_call = configure.index("attachWithViewBinder:")
          assert configure.index(
              "[IFLYNativeFeedAd detachAdFromContainerView:self.cardView]",
              attach_call,
          ) > attach_call, "attach 失败必须清理本次容器挂载"
          prepare_start = native.index("- (void)prepareForReuse")
          prepare_end = native.index("- (void)setVideoCoverVisible:", prepare_start)
          assert "[self detachFromContainer]" in native[prepare_start:prepare_end]
          detach_at = native.index("[attachedCell detachFromContainer]")
          release_at = native.index("item.ad = nil")
          assert detach_at < release_at, "逻辑条目必须先按容器 detach，再释放 Ad"
          did_end = native.index("didEndDisplayingCell:")
          continue_after_detach = native.index(
              "continueDisplayingItemAfterCellDetached:", did_end
          )
          assert native.index("[adCell detachFromContainer]", did_end) < continue_after_detach
          attach_success = native.index("if (attached)")
          video_state_restore = native.index(
              "[cell setVideoCoverVisible:item.videoCoverVisible", attach_success
          )
          assert attach_success < video_state_restore
          assert native.count("[self recordVideoCoverVisible:") >= 5

          prefix = Path(
              "IFLYADLibSimple/IFLYADLibSimple/Supporting Files/IFLYAdPrefixHeader.pch"
          ).read_text(encoding="utf-8")
          slot_macros = {
              "__SPLASH_NATIVE_AD_UNIT_ID__": "BC05C9AA5D3E0D3E8F1B25CDAB603831",
              "__SPLASH_VIDEO_AD_UNIT_ID__": "5AF6465D44FCFAD4935C20D620614506",
              "__INTERSTITIAL_AD_UNIT_ID__": "A830C77F232A5DE10AF0E4B92E0426C9",
              "__INTERSTITIAL_LANDSCAPE_IMAGE_AD_UNIT_ID__": "A830C77F232A5DE10AF0E4B92E0426C9",
              "__INTERSTITIAL_PORTRAIT_VIDEO_AD_UNIT_ID__": "784C8D7CF6CFC970473E3CB1DE893B61",
              "__INTERSTITIAL_LANDSCAPE_VIDEO_AD_UNIT_ID__": "784C8D7CF6CFC970473E3CB1DE893B61",
              "__TYPED_ONE_NATIVE_AD_UNIT_ID__": "C954B4CD38EE3DE2D7A6283169B3E459",
              "__FEED_VIDEO_AD_UNIT_ID__": "C389BA3CD04BF2771C944B58E493DF94",
          }
          assert len(set(slot_macros.values())) == 6
          for macro, ad_unit_id in slot_macros.items():
              pattern = rf'#define\s+{re.escape(macro)}\s+@"{ad_unit_id}"'
              assert re.search(pattern, prefix), macro
          old_ad_unit_ids = {
              "D65CC066BF3AE066C48F4A101A30005C",
              "DDC620929747D6DB85FFEB14AB893F4E",
              "22E131CFF097584531EAB3281C40769C",
              "28AA4CE6390C2F6A874B9425C2223E0A",
              "2C87A382F3D0CFFC844328E8C8CD8B51",
              "284707795BA1F6A692D315CD02CDD78D",
              "24556006C29E3C51A624F4B704BC7345",
              "3AE3AC7B093A4CC6A1E2F19CF16709FC",
          }
          assert not any(ad_unit_id in prefix for ad_unit_id in old_ad_unit_ids)
          for macro in (
              "__TYPED_ONE_NATIVE_AD_UNIT_ID__",
              "__FEED_VIDEO_AD_UNIT_ID__",
          ):
              assert macro in native, macro

          for macro in (
              "__SPLASH_NATIVE_AD_UNIT_ID__",
              "__SPLASH_VIDEO_AD_UNIT_ID__",
              "__INTERSTITIAL_AD_UNIT_ID__",
              "__INTERSTITIAL_LANDSCAPE_IMAGE_AD_UNIT_ID__",
              "__INTERSTITIAL_PORTRAIT_VIDEO_AD_UNIT_ID__",
              "__INTERSTITIAL_LANDSCAPE_VIDEO_AD_UNIT_ID__",
          ):
              assert macro in presentation, macro
          PY

  verify-release:
    name: 校验正式 Release 资产与 Demo 编译
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [verify-repository]
    runs-on: macos-15
    permissions:
      contents: read
    env:
      EXPECTED_AD_REQUEST_URL: https://youku-sdk.voiceads.cn/ad/request
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true

      - name: 校验 CI Xcode 与 Release tag
        run: |
          xcodebuild -version
          [[ "${RELEASE_TAG}" == '6.2.2' ]]
          test -z "$(git status --porcelain)"
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = 'tag'
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${RELEASE_TAG}^{commit}")"
          test "$(git describe --tags --exact-match HEAD)" = "${RELEASE_TAG}"
          python3 - <<'PY'
          import re
          import subprocess

          output = subprocess.check_output(["xcodebuild", "-version"], text=True)
          match = re.search(r"Xcode\s+(\d+)(?:\.\d+)*", output)
          assert match and int(match.group(1)) >= 16, output
          PY

      - name: 读取本次 Release 元数据
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > /tmp/youku-release-metadata.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(
              Path("/tmp/youku-release-metadata.json").read_text(encoding="utf-8")
          )
          tag = os.environ["RELEASE_TAG"]
          expected = {
              "IFLYADLib.xcframework.zip",
              f"YKIFLYADLib-{tag}.zip",
              "checksums.txt",
              "delivery-manifest.json",
          }
          actual = {asset["name"] for asset in release.get("assets", [])}
          assert release["tag_name"] == tag
          assert release["draft"] is False
          assert release["prerelease"] is False
          assert actual == expected, f"actual={sorted(actual)}, expected={sorted(expected)}"
          PY

      - name: 匿名下载本次 Release 的精确资产集
        run: |
          rm -rf /tmp/youku-release-anonymous
          env \
            -u GH_TOKEN \
            -u GITHUB_TOKEN \
            -u GITHUB_AUTH_TOKEN \
            -u IFLY_PRIVATE_SOURCE_TOKEN \
            python3 .github/scripts/download_release_anonymously.py \
              --repository "${GITHUB_REPOSITORY}" \
              --tag "${RELEASE_TAG}" \
              --destination /tmp/youku-release-anonymous \
              --metadata-output /tmp/youku-release-anonymous-metadata.json

      - name: 校验匿名下载的 Release 资产与私有源码 A/B provenance
        env:
          IFLY_PRIVATE_SOURCE_TOKEN: ${{ secrets.IFLY_PRIVATE_SOURCE_TOKEN }}
        run: |
          python3 .github/scripts/verify_private_release_provenance.py \
            --readme README.md \
            --changelog CHANGELOG.md \
            --releasing RELEASING.md \
            --manifest /tmp/youku-release-anonymous/delivery-manifest.json \
            --release-metadata /tmp/youku-release-anonymous-metadata.json

      - name: 校验 checksum、双包结构、能力、资源和请求地址
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import plistlib
          import re
          import subprocess
          import zipfile
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path("/tmp/youku-release-anonymous")
          manifest = json.loads((root / "delivery-manifest.json").read_text(encoding="utf-8"))
          version = manifest["version"]
          assert version == os.environ["RELEASE_TAG"], "Release tag 与 manifest 版本不一致"
          assert manifest["distribution"] == "Youku"
          assert manifest["variant"] == "Youku"
          assert manifest["capabilities"] == ["Splash", "Interstitial", "NativeFeed"]
          assert manifest["mediaShakeReportingEnabled"] is True
          assert manifest["sourceBuild"]["customAdRequestURL"] is True
          assert manifest["sourceBuild"]["sdkVersion"] == version
          assert manifest["sourceBuild"]["sourceTreeClean"] is True
          assert manifest["sourceBuild"]["sourceCommit"] == manifest["sourceCommit"]
          assert "IFLYAd_COMPILE_MEDIA_SHAKE_REPORTING" in manifest["sourceBuild"]["enabledMacros"]
          xcode_version = tuple(
              int(item)
              for item in re.search(r"\d+(?:\.\d+)+", manifest["sourceBuild"]["xcodeVersion"])
              .group(0)
              .split(".")
          )
          assert xcode_version <= (26, 2), f"正式 SDK 使用了超上限 Xcode: {xcode_version}"

          expected_url = os.environ.get("EXPECTED_AD_REQUEST_URL", "").strip()
          assert expected_url, "正式请求地址未配置"
          assert manifest["adRequestURL"] == expected_url
          assert manifest["sourceBuild"]["adRequestURL"] == expected_url
          parsed = urlsplit(expected_url)
          assert parsed.scheme == "https" and parsed.hostname
          assert expected_url == "https://youku-sdk.voiceads.cn/ad/request"
          assert not parsed.hostname.endswith((".invalid", ".example", ".test"))
          assert parsed.hostname not in {"localhost", "127.0.0.1", "::1"}
          expected_tracking_host = parsed.hostname.lower()

          combined_name = f"YKIFLYADLib-{version}.zip"
          exact_assets = {
              "IFLYADLib.xcframework.zip",
              combined_name,
              "checksums.txt",
              "delivery-manifest.json",
          }
          actual_assets = {item.name for item in root.iterdir() if item.is_file()}
          assert actual_assets == exact_assets, (actual_assets, exact_assets)

          assets = {item["name"]: item for item in manifest["assets"]}
          assert set(assets) == {"IFLYADLib.xcframework.zip", combined_name}
          for name, metadata in assets.items():
              path = root / name
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual == metadata["sha256"], name

          checksum_lines = [
              line.strip()
              for line in (root / "checksums.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          assert len(checksum_lines) == 2, checksum_lines
          spm_match = re.fullmatch(
              r"SPM  (\S+)  spm_checksum=([0-9a-f]{64})  sha256=([0-9a-f]{64})",
              checksum_lines[0],
          )
          combined_match = re.fullmatch(
              r"Combined  (\S+)  sha256=([0-9a-f]{64})",
              checksum_lines[1],
          )
          assert spm_match, checksum_lines[0]
          assert combined_match, checksum_lines[1]
          assert spm_match.group(1) == "IFLYADLib.xcframework.zip"
          assert combined_match.group(1) == combined_name
          assert spm_match.group(2) == assets["IFLYADLib.xcframework.zip"]["swiftPackageChecksum"]
          assert spm_match.group(3) == assets["IFLYADLib.xcframework.zip"]["sha256"]
          assert combined_match.group(2) == assets[combined_name]["sha256"]

          computed_spm_checksum = subprocess.check_output(
              [
                  "swift",
                  "package",
                  "compute-checksum",
                  str(root / "IFLYADLib.xcframework.zip"),
              ],
              text=True,
          ).strip()
          assert computed_spm_checksum == spm_match.group(2)

          package = Path("Package.swift").read_text(encoding="utf-8")
          podspec = Path("YKIFLYADLib.podspec").read_text(encoding="utf-8")
          declared_checksum = re.search(r'checksum:\s*"([0-9a-f]{64})"', package).group(1)
          assert declared_checksum == assets["IFLYADLib.xcframework.zip"]["swiftPackageChecksum"]
          assert declared_checksum == assets["IFLYADLib.xcframework.zip"]["sha256"]
          assert declared_checksum == computed_spm_checksum
          assert f"/releases/download/{version}/IFLYADLib.xcframework.zip" in package
          assert f"s.version = '{version}'" in podspec
          assert f"/releases/download/{version}/{combined_name}" in podspec

          spm_out = root / "spm"
          combined_out = root / "combined"
          with zipfile.ZipFile(root / "IFLYADLib.xcframework.zip") as archive:
              archive.extractall(spm_out)
          with zipfile.ZipFile(root / combined_name) as archive:
              archive.extractall(combined_out)

          def top_level_entries(path):
              return {
                  item.name
                  for item in path.iterdir()
                  if item.name != "__MACOSX" and not item.name.startswith("._")
              }

          assert top_level_entries(spm_out) == {"IFLYADLib.xcframework"}
          assert top_level_entries(combined_out) == {
              "IFLYADLib.xcframework",
              "IFLYPlayer.bundle",
              "LICENSE",
          }

          spm_frameworks = list(spm_out.glob("IFLYADLib.xcframework"))
          combined_frameworks = list(combined_out.glob("IFLYADLib.xcframework"))
          assert len(spm_frameworks) == len(combined_frameworks) == 1
          assert (combined_out / "IFLYPlayer.bundle/PrivacyInfo.xcprivacy").is_file()
          assert (combined_out / "LICENSE").is_file()

          def tree_hashes(path):
              return {
                  file.relative_to(path).as_posix(): hashlib.sha256(file.read_bytes()).hexdigest()
                  for file in path.rglob("*")
                  if file.is_file() and not file.name.startswith("._") and file.name != ".DS_Store"
              }

          assert tree_hashes(spm_frameworks[0]) == tree_hashes(combined_frameworks[0])
          repo_bundle = Path("spm/IFLYAdResources/IFLYPlayer.bundle")
          assert tree_hashes(repo_bundle) == tree_hashes(combined_out / "IFLYPlayer.bundle")
          privacy_manifests = [
              *spm_frameworks[0].rglob("PrivacyInfo.xcprivacy"),
              *combined_frameworks[0].rglob("PrivacyInfo.xcprivacy"),
              combined_out / "IFLYPlayer.bundle/PrivacyInfo.xcprivacy",
              repo_bundle / "PrivacyInfo.xcprivacy",
          ]
          assert all(path.is_file() for path in privacy_manifests)
          stale_tracking_hosts = {
              "msdk.voiceads.cn",
              "youku-sdk-grey.voiceads.cn",
          }
          for privacy_manifest in privacy_manifests:
              privacy = plistlib.loads(privacy_manifest.read_bytes())
              domains = {
                  item.lower() for item in privacy.get("NSPrivacyTrackingDomains", [])
              }
              assert expected_tracking_host in domains, privacy_manifest
              assert not (stale_tracking_hosts & domains), privacy_manifest

          required_headers = {
              "IFLYSplashAd.h",
              "IFLYInterstitialAd.h",
              "IFLYNativeFeedAd.h",
              "IFLYNativeFeedAdData.h",
          }
          denied_headers = {
              "IFLYBannerAd.h",
              "IFLYRewardVideoAd.h",
              "IFLYNativeFeedDisplaySession.h",
              "IFLYNativeFeedAdBinding.h",
          }
          previous_urls = {
              "https://msdk.voiceads.cn/sdk/req",
              "https://youku-sdk-grey.voiceads.cn/sdk/req",
              "https://youku-sdk.voiceads.cn/sdk/req",
          }
          team_ids = set()

          for framework in (spm_frameworks[0], combined_frameworks[0]):
              headers = {path.name for path in framework.rglob("Headers/*.h")}
              assert required_headers <= headers
              assert not (denied_headers & headers)
              native_feed_headers = list(framework.rglob("Headers/IFLYNativeFeedAd.h"))
              error_headers = list(framework.rglob("Headers/IFLYAdError.h"))
              assert native_feed_headers and error_headers
              assert all(
                  "reportMediaShakeTriggeredWithError:" in path.read_text(encoding="utf-8")
                  for path in native_feed_headers
              )
              for managed_api in (
                  "attachWithViewBinder:",
                  "detachAdFromContainerView:",
                  "destroy",
              ):
                  assert all(
                      managed_api in path.read_text(encoding="utf-8")
                      for path in native_feed_headers
                  ), managed_api
              for legacy_api in (
                  "IFLYNativeFeedDisplaySession",
                  "IFLYNativeFeedAdBinding",
                  "beginDisplaySessionWithError:",
                  "bindAdWithViewBinder:",
                  "unbindAd",
                  "endDisplaySession",
              ):
                  assert all(
                      legacy_api not in path.read_text(encoding="utf-8")
                      for path in native_feed_headers
                  ), legacy_api
              for error_code in ("71506", "71512", "71513", "71514", "71515"):
                  assert all(
                      error_code in path.read_text(encoding="utf-8")
                      for path in error_headers
                  )

              binaries = list(framework.rglob("IFLYADLib.framework/IFLYADLib"))
              assert len(binaries) == 2, [str(item) for item in binaries]
              device_arm64 = simulator_arm64 = simulator_x86_64 = False
              for binary in binaries:
                  framework_dir = binary.parent
                  subprocess.check_call(
                      ["codesign", "--verify", "--strict", "--verbose=2", str(framework_dir)]
                  )
                  signature = subprocess.check_output(
                      ["codesign", "-d", "--verbose=4", str(framework_dir)],
                      text=True,
                      stderr=subprocess.STDOUT,
                  )
                  assert "Signature=adhoc" not in signature
                  team_match = re.search(r"(?m)^TeamIdentifier=(.+)$", signature)
                  assert team_match and team_match.group(1).strip().lower() not in {
                      "",
                      "not set",
                      "none",
                  }
                  team_ids.add(team_match.group(1).strip())

                  text = subprocess.check_output(["strings", str(binary)], text=True)
                  lines = set(text.splitlines())
                  assert expected_url in lines
                  assert not (previous_urls & lines)
                  assert version in lines
                  assert "reportMediaShakeTriggeredWithError:" in lines
                  assert "attachWithViewBinder:error:" in lines
                  assert "detachAdFromContainerView:" in lines
                  assert "destroy" in lines
                  for legacy_selector in (
                      "beginDisplaySessionWithError:",
                      "bindAdWithViewBinder:error:",
                      "unbindAd",
                      "endDisplaySession",
                  ):
                      assert legacy_selector not in lines, legacy_selector
                  assert "IFLYAdMotionSamplingCoordinator" in lines
                  symbols = subprocess.check_output(
                      ["nm", "-g", str(binary)], text=True, errors="replace"
                  )
                  assert "_OBJC_CLASS_$_IFLYBanner" not in symbols
                  assert "_OBJC_CLASS_$_IFLYReward" not in symbols
                  assert "_OBJC_CLASS_$_IFLYAdMotionSamplingCoordinator" in symbols

                  architectures = set(
                      subprocess.check_output(["lipo", "-archs", str(binary)], text=True).split()
                  )
                  is_simulator = "simulator" in binary.as_posix()
                  if is_simulator:
                      simulator_arm64 |= "arm64" in architectures
                      simulator_x86_64 |= "x86_64" in architectures
                  else:
                      device_arm64 |= "arm64" in architectures

                  info_path = binary.parent / "Info.plist"
                  info = plistlib.loads(info_path.read_bytes())
                  assert info["MinimumOSVersion"] == "11.0"
                  assert info["CFBundleShortVersionString"] == version
              assert device_arm64 and simulator_arm64 and simulator_x86_64
          assert len(team_ids) == 1, f"framework 切片 TeamIdentifier 不一致: {team_ids}"

          print(f"release {version} validated")
          PY

      - name: 使用本次 Release 产物编译 Demo
        run: |
          cp YKIFLYADLib.podspec /tmp/youku-release-anonymous/combined/YKIFLYADLib.podspec
          cat > IFLYADLibSimple/Podfile <<'EOF'
          platform :ios, '11.0'
          target 'IFLYADLibSimple' do
            use_frameworks!
            pod 'YKIFLYADLib', :path => '/tmp/youku-release-anonymous/combined'
          end
          EOF
          pod install --project-directory=IFLYADLibSimple
          xcodebuild build \
            -workspace IFLYADLibSimple/IFLYADLibSimple.xcworkspace \
            -scheme IFLYADLibSimple \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/youku-pod-derived \
            CODE_SIGNING_ALLOWED=NO

          xcodebuild \
            -workspace IFLYADLibSimple/IFLYADLibSimple.xcworkspace \
            -scheme IFLYADLibSimple \
            -configuration Debug \
            -sdk iphonesimulator \
            -showBuildSettings \
            -json > /tmp/youku-pod-build-settings.json

          python3 - <<'PY'
          import json
          import shlex
          from pathlib import Path

          records = json.loads(
              Path("/tmp/youku-pod-build-settings.json").read_text(encoding="utf-8")
          )
          apps = [item for item in records if item.get("target") == "IFLYADLibSimple"]
          if len(apps) != 1:
              raise SystemExit(f"无法唯一定位最终 App build settings: {len(apps)}")
          flags = apps[0].get("buildSettings", {}).get("OTHER_LDFLAGS", "")
          if "-ObjC" not in shlex.split(flags):
              raise SystemExit(f"最终 App OTHER_LDFLAGS 未包含 -ObjC: {flags}")
          print(f"OK 最终 App OTHER_LDFLAGS: {flags}")
          PY

      - name: 使用本次 Release 产物编译 SwiftPM 产品并校验资源
        run: |
          rm -rf /tmp/youku-spm-package /tmp/youku-spm-derived
          mkdir -p /tmp/youku-spm-package/spm
          cp .github/fixtures/swiftpm-local/Package.swift /tmp/youku-spm-package/Package.swift
          cp -R /tmp/youku-release-anonymous/spm/IFLYADLib.xcframework \
            /tmp/youku-spm-package/IFLYADLib.xcframework
          cp -R spm/IFLYAdResources /tmp/youku-spm-package/spm/IFLYAdResources

          (
            cd /tmp/youku-spm-package
            xcodebuild build \
              -scheme YKIFLYADLibReleaseValidation \
              -configuration Debug \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath /tmp/youku-spm-derived \
              CODE_SIGNING_ALLOWED=NO \
              IPHONEOS_DEPLOYMENT_TARGET=11.0 \
              OTHER_LDFLAGS='$(inherited) -ObjC'
          )

          test -d \
            /tmp/youku-spm-derived/Build/Products/Debug-iphonesimulator/YKIFLYADLibReleaseValidation_IFLYAdResources.bundle/IFLYPlayer.bundle
          test -f \
            /tmp/youku-spm-derived/Build/Products/Debug-iphonesimulator/YKIFLYADLibReleaseValidation_IFLYAdResources.bundle/IFLYPlayer.bundle/PrivacyInfo.xcprivacy

          spm_product_dir=/tmp/youku-spm-derived/Build/Products/Debug-iphonesimulator
          simulator_sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun clang \
            -ObjC \
            -fobjc-arc \
            -isysroot "${simulator_sdk}" \
            -target arm64-apple-ios11.0-simulator \
            -F "${spm_product_dir}" \
            -framework IFLYADLib \
            -x objective-c - \
            -o /tmp/youku-spm-consumer <<'EOF'
          #import <IFLYADLib/IFLYADLib.h>
          int main(void) {
            @autoreleasepool {
              NSLog(@"linked %@", [IFLYAdBase class]);
            }
            return 0;
          }
          EOF

      - name: 校验 CocoaPods 与 SwiftPM 最终链接的 IDFA 系统框架依赖
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          binaries = {
              "CocoaPods Demo": Path(
                  "/tmp/youku-pod-derived/Build/Products/Debug-iphonesimulator/"
                  "IFLYADLibSimple.app/IFLYADLibSimple"
              ),
              "SwiftPM 最小消费端": Path("/tmp/youku-spm-consumer"),
          }

          def framework_load_commands(binary: Path, framework: str) -> list[str]:
              output = subprocess.check_output(
                  ["xcrun", "otool", "-l", str(binary)],
                  text=True,
              )
              current_command = ""
              commands = []
              framework_marker = f"/{framework}.framework/"
              for raw_line in output.splitlines():
                  fields = raw_line.strip().split()
                  if len(fields) >= 2 and fields[0] == "cmd":
                      current_command = fields[1]
                  elif (
                      len(fields) >= 2
                      and fields[0] == "name"
                      and framework_marker in fields[1]
                  ):
                      commands.append(current_command)
              return commands

          for description, binary in binaries.items():
              assert binary.is_file(), f"{description} 最终链接产物不存在: {binary}"
              dependencies = subprocess.check_output(
                  ["xcrun", "otool", "-L", str(binary)],
                  text=True,
              )
              assert "/AdSupport.framework/AdSupport" in dependencies, (
                  f"{description} 缺少 AdSupport 依赖"
              )
              att_commands = framework_load_commands(
                  binary, "AppTrackingTransparency"
              )
              assert att_commands, (
                  f"{description} 缺少 AppTrackingTransparency 依赖"
              )
              assert set(att_commands) == {"LC_LOAD_WEAK_DYLIB"}, (
                  f"{description} 的 AppTrackingTransparency 未保持弱链接: "
                  f"{att_commands}"
              )
              print(
                  f"{description}: AdSupport 已链接，"
                  "AppTrackingTransparency=LC_LOAD_WEAK_DYLIB"
              )
          PY
